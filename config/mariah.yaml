candidate: "Syeda Mariah Banu"
titles:
  include: ["Machine Learning Engineer","AI Engineer","Applied Scientist","Computer Vision Engineer","Data Scientist"]
  exclude_exact: ["Director","VP","Principal","Staff"]
  allow_adjacent: true
seniority: {min: "junior", max: "senior"}

locations:
  remote_ok: true
  remote_strict: true            # <-- turn on strict country check for remote
  remote_country_whitelist:      # <-- move here (top-level under locations)
    - US
    - USA
    - United States
    - U.S.
  local_roles_regions:
    - name: Greater St. Louis (MO-IL)
      center: "St. Louis, MO"
      radius_km: 50
work_mode: ["remote","hybrid","onsite"]

filters:
  employment_type: ["full-time","contract"]
  salary_floor_usd: null
  visa_requires_sponsorship: null
  industries:
    prefer: []
    avoid: ["Banking"]
  negative_keywords: ["intern","content writer","annotator","commission","unpaid"]

sources_allowed: ["greenhouse","lever","ashby","workable","workday","google_jobs"]
post_age_days_max: 45

companies:
  prefer: ["Mastercard","Charter Communications"]
  avoid: []

scoring_bias:
  emphasize: ["Computer Vision","LLM/RAG","Model Serving on Kubernetes","FastAPI","MLflow","AWS EKS","ONNX","TensorRT"]

output:
  excel_path: "./out/Top50_Mariah.xlsx"
  extra_columns: []

run:
  frequency: "daily"
  persist_seen_in_csv: true
  seen_csv_path: "./out/seen_jobs.csv"

environment:
  os: "macOS"
  python: "3.11"
  resume_path: "./resume/mariah_banu.pdf"

review:
  enable: true
  embed_model: "BAAI/bge-small-en-v1.5"
  min_cosine: 0.41        # start here; you can tune
  hard_keywords_any: ["Computer Vision","LLM","RAG","Kubernetes","FastAPI","MLflow","TensorRT","ONNX"]
  hard_negatives_any: ["IT Helpdesk","Sales","Account Executive","Banking","Finance Auditor"]

# Model comparison configuration
model_comparison:
  enabled: true                    # Set to false after initial comparison
  models: ["qwen25"]               # Test only Qwen 2.5 for now
  job_limit: 5                     # Number of jobs to test each model on
  auto_select_winner: false        # Automatically update config with winner
  
# LLM configuration for resume tailoring
llm:
  selected_model: null             # Will be set by model comparison
  torch_dtype: "float16"           # Memory optimization
  device: "auto"                   # Let transformers decide GPU/CPU
  generation_params:
    temperature: 0.3
    max_tokens: 1024
    top_p: 0.9
    top_k: 50

